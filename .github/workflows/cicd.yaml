name: Build and Push Docker Image

# 1. ADDED: Trigger on pull requests targeting 'master'
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Read the repository and nothing else. Pushing the image uses Docker Hub's own credentials.
permissions:
  contents: read

# A newer push to the same branch or PR makes the older run's result irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The two test tiers run side by side (W-420, D-1005): the unit tier is CPU-bound and parallel, the integration tier runs
  # its classes one at a time (@Isolated), so together they took the longest part of one job's run. Each job keeps
  # -Dmaven.test.failure.ignore=true so its reports and coverage data are uploaded even when tests fail; the gate job below
  # is what fails the pipeline.
  unit:
    runs-on: [ubuntu-latest]
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      # One pass: Spotless and Checkstyle run at validate (their executions in the root pom), then compile, the unit tier
      # with the JaCoCo agent, and the jar the image wraps. The coverage checks run in the gate, on both tiers' data.
      - name: Check formatting, run the unit tier, build the jar
        run: ./mvnw -B clean package -Punit -Dmaven.test.failure.ignore=true

      # The classes the coverage checks read, as one file: upload-artifact moves files one at a time.
      - name: Name the unit tier's coverage data and pack its classes
        if: ${{ !cancelled() }}
        run: |
          cp backend/target/jacoco.exec backend/target/jacoco-unit.exec
          tar -cf backend/target/classes.tar -C backend/target classes

      - name: Upload the unit tier's results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-results
          path: |
            backend/target/surefire-reports/TEST-*.xml
            test-report/target/surefire-reports/TEST-*.xml
            backend/target/jacoco-unit.exec
            backend/target/classes.tar
            backend/target/wealthlens.jar

  integration:
    runs-on: [ubuntu-latest]
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        # The api-collection is checked against the generated spec (ApiCollectionContractIntegrationTest, W-359b)
        with:
          submodules: true

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run the integration tier
        run: ./mvnw -B clean test -pl backend -Pintegration -Dmaven.test.failure.ignore=true

      - name: Name the integration tier's coverage data
        if: ${{ !cancelled() }}
        run: cp backend/target/jacoco.exec backend/target/jacoco-integration.exec

      - name: Upload the integration tier's results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: integration-results
          path: |
            backend/target/surefire-reports/TEST-*.xml
            backend/target/jacoco-integration.exec

  gate:
    needs: [unit, integration]
    if: ${{ !cancelled() }}
    runs-on: [ubuntu-latest]
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      # Both tiers' reports land in backend/target/surefire-reports (one file per class, so none collide); the unit job also
      # brings the compiled classes the coverage checks read and the jar the image wraps. An artifact keeps paths from its
      # files' common folder: the unit tier's is the repository root, the integration tier's backend/target.
      - name: Download the unit tier's results
        uses: actions/download-artifact@v8
        with:
          name: unit-results
          path: .

      - name: Download the integration tier's results
        uses: actions/download-artifact@v8
        with:
          name: integration-results
          path: backend/target

      - name: Unpack the classes
        run: tar -xf backend/target/classes.tar -C backend/target

      # The four checks are the root pom's own executions, run on the merged data of both tiers, as one job's run read it.
      - name: Merge coverage and apply the coverage gates
        run: >-
          ./mvnw -B -pl backend jacoco:merge@merge-tiers jacoco:report@report
          jacoco:check@check-charges-engine jacoco:check@check-trade-ledger
          jacoco:check@check-taxengine jacoco:check@check-taxengine-rules

      - name: Check for test failures
        if: ${{ !cancelled() }}
        run: |
          # A missing report is not a pass. If the suite did not run, fail rather than
          # succeed on absent evidence.
          MIN_REPORTS=25
          REPORT_COUNT=$(ls backend/target/surefire-reports/TEST-*.xml \
                            test-report/target/surefire-reports/TEST-*.xml 2>/dev/null | wc -l | tr -d ' ')
          echo "Found $REPORT_COUNT surefire report(s)."
          if [ "$REPORT_COUNT" -lt "$MIN_REPORTS" ]; then
            echo "Expected at least $MIN_REPORTS reports. The test suite did not run to completion."
            exit 1
          fi

          FAILED=0
          for f in backend/target/surefire-reports/TEST-*.xml test-report/target/surefire-reports/TEST-*.xml; do
            [ -f "$f" ] || continue
            if grep -E 'failures="[1-9]' "$f" >/dev/null || grep -E 'errors="[1-9]' "$f" >/dev/null; then
              echo "Test failures found in: $f"
              # One annotation per failing class, with its first failure's type and message, so the
              # cause is readable on the run's page without opening the log.
              python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          suite = ET.parse(sys.argv[1]).getroot()
          for case in suite.iter("testcase"):
              problem = case.find("failure") if case.find("failure") is not None else case.find("error")
              if problem is not None:
                  # The "Caused by" lines carry the root cause; an initializer error's own message is empty.
                  causes = [line.strip() for line in (problem.text or "").splitlines() if line.strip().startswith("Caused by:")]
                  message = " ".join((problem.get("type", "") + ": " + problem.get("message", "") + " " + " | ".join(causes)).split())[:1800]
                  print(f"::error title={suite.get('name')}::{case.get('name')}: {message}")
                  break
          PY
              FAILED=1
            fi
          done
          if [ "$FAILED" -eq 1 ]; then
            echo "Failing build due to test failures."
            exit 1
          fi

      - name: Generate the consolidated report
        if: always()
        run: ./mvnw -B -pl test-report compile exec:java@generate-consolidated-report

      - name: Upload consolidated test report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: consolidated-test-report
          path: test-report/target/consolidated-test-report.html

      # The full JaCoCo HTML site is 471 files. upload-artifact transfers file by file,
      # which costs far more than the report is worth on every run. The XML is one file
      # and is what any coverage tooling consumes; the HTML is reproducible locally with
      # `./mvnw test -pl backend` -> backend/target/site/jacoco/index.html
      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jacoco-coverage-xml
          path: backend/target/site/jacoco/jacoco.xml

      # The image is tagged with the commit (for rollback) and with a moving name: `latest` on master,
      # the sanitised branch name on a pull request. The branch name is read from the environment,
      # never interpolated into the script: a PR's author chooses it.
      - name: Set Docker image tags
        id: set_tag
        env:
          HEAD_REF: ${{ github.head_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          REPO_IMAGE="tperamasani/wealthlens"
          SHA_TAG="sha-${GITHUB_SHA::12}"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BRANCH_TAG=$(printf '%s' "$HEAD_REF" | tr -dc '[:alnum:]-._/' | tr '[:upper:]' '[:lower:]' | tr '/' '-')
            MOVING_TAG="$BRANCH_TAG"
          else
            MOVING_TAG="latest"
          fi
          echo "::notice::Image tags: ${REPO_IMAGE}:${MOVING_TAG}, ${REPO_IMAGE}:${SHA_TAG}"
          echo "moving=${REPO_IMAGE}:${MOVING_TAG}" >> "$GITHUB_OUTPUT"
          echo "sha=${REPO_IMAGE}:${SHA_TAG}" >> "$GITHUB_OUTPUT"

      # The image wraps the jar the steps above built and tested; the Dockerfile compiles nothing.
      - name: Build docker image
        run: docker build -t "${{ steps.set_tag.outputs.moving }}" -t "${{ steps.set_tag.outputs.sha }}" .

      # Built on every run, so a pull request proves the Dockerfile; pushed only from master, the one tag anything pulls
      # (`latest`, runbook) and its commit tag (W-420 C3a).
      - name: Login to docker hub
        if: success() && github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Publish image to docker hub
        if: success() && github.event_name == 'push'
        run: |
          docker push "${{ steps.set_tag.outputs.moving }}"
          docker push "${{ steps.set_tag.outputs.sha }}"

  # The performance budgets (PRD §5 N1 – N3, W-143; the calendar, W-114) under -Pbenchmark, uninstrumented. Off by default:
  # timings matter only when a change could move them, and the owner's laptop throttles, so they run here and only while
  # the repository variable RUN_BENCHMARKS is 'true' — set it for the push that needs them and unset it once the run reports
  # (`gh variable set RUN_BENCHMARKS --body true`, then `gh variable delete RUN_BENCHMARKS`). Its own job, so the build's
  # surefire gate and report count are untouched.
  benchmark:
    if: ${{ vars.RUN_BENCHMARKS == 'true' }}
    runs-on: [ubuntu-latest]
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      # The budgets' timing lines (W-143 …, W-114 calendar …) are copied into the run's summary.
      - name: Run the performance budgets
        run: |
          set -o pipefail
          ./mvnw test -pl backend -Pbenchmark | tee benchmark.log
          { echo '### Benchmark timings'; echo '```'; { grep -E 'W-[0-9]+[a-z]? ' benchmark.log || true; } | sed 's/.* -- //'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

