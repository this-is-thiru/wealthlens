name: Build and Push Docker Image

# 1. ADDED: Trigger on pull requests targeting 'master'
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Read the repository and nothing else. Pushing the image uses Docker Hub's own credentials.
permissions:
  contents: read

# A newer push to the same branch or PR makes the older run's result irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: [ubuntu-latest]
    # The whole run takes under 10 minutes; a hung container wait must not hold a runner for 6 hours.
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      # spotless:check runs inside this single invocation rather than as its own step.
      # A separate ./mvnw call costs a full JVM boot plus reactor and plugin resolution
      # on a cold runner — tens of seconds for a check that takes ~2s of actual work.
      # It still runs before the tests, so formatting drift fails fast.
      #
      # -Dmaven.test.failure.ignore=true is set HERE ONLY, so the build reaches `verify`
      # and the consolidated HTML report is generated even when tests fail. The gate below
      # is what fails the pipeline. Local and IDE runs use the default (false) and fail
      # immediately on a test failure, so an exit code means what it says.
      - name: Verify formatting, run tests, generate consolidated report
        run: ./mvnw clean spotless:check test verify -Dmaven.test.failure.ignore=true

      # Runs even when the step above failed. A failing coverage gate stops that step, and the
      # tests whose failure caused it would otherwise go unreported — the integration tier
      # erroring as a whole looks exactly like "UserChargeService coverage 0.88".
      - name: Check for test failures
        if: ${{ !cancelled() }}
        run: |
          # A missing report is not a pass. If the suite did not run, fail rather than
          # succeed on absent evidence.
          MIN_REPORTS=25
          REPORT_COUNT=$(ls backend/target/surefire-reports/TEST-*.xml \
                            test-report/target/surefire-reports/TEST-*.xml 2>/dev/null | wc -l | tr -d ' ')
          echo "Found $REPORT_COUNT surefire report(s)."
          if [ "$REPORT_COUNT" -lt "$MIN_REPORTS" ]; then
            echo "Expected at least $MIN_REPORTS reports. The test suite did not run to completion."
            exit 1
          fi

          FAILED=0
          for f in backend/target/surefire-reports/TEST-*.xml test-report/target/surefire-reports/TEST-*.xml; do
            [ -f "$f" ] || continue
            if grep -E 'failures="[1-9]' "$f" >/dev/null || grep -E 'errors="[1-9]' "$f" >/dev/null; then
              echo "Test failures found in: $f"
              # One annotation per failing class, with its first failure's type and message, so the
              # cause is readable on the run's page without opening the log.
              python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          suite = ET.parse(sys.argv[1]).getroot()
          for case in suite.iter("testcase"):
              problem = case.find("failure") if case.find("failure") is not None else case.find("error")
              if problem is not None:
                  # The "Caused by" lines carry the root cause; an initializer error's own message is empty.
                  causes = [line.strip() for line in (problem.text or "").splitlines() if line.strip().startswith("Caused by:")]
                  message = " ".join((problem.get("type", "") + ": " + problem.get("message", "") + " " + " | ".join(causes)).split())[:1800]
                  print(f"::error title={suite.get('name')}::{case.get('name')}: {message}")
                  break
          PY
              FAILED=1
            fi
          done
          if [ "$FAILED" -eq 1 ]; then
            echo "Failing build due to test failures."
            exit 1
          fi

      - name: Upload consolidated test report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: consolidated-test-report
          path: test-report/target/consolidated-test-report.html

      # The full JaCoCo HTML site is 471 files. upload-artifact transfers file by file,
      # which costs far more than the report is worth on every run. The XML is one file
      # and is what any coverage tooling consumes; the HTML is reproducible locally with
      # `./mvnw test -pl backend` -> backend/target/site/jacoco/index.html
      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jacoco-coverage-xml
          path: backend/target/site/jacoco/jacoco.xml

      # The image is tagged with the commit (for rollback) and with a moving name: `latest` on master,
      # the sanitised branch name on a pull request. The branch name is read from the environment,
      # never interpolated into the script: a PR's author chooses it.
      - name: Set Docker image tags
        id: set_tag
        env:
          HEAD_REF: ${{ github.head_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          REPO_IMAGE="tperamasani/wealthlens"
          SHA_TAG="sha-${GITHUB_SHA::12}"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BRANCH_TAG=$(printf '%s' "$HEAD_REF" | tr -dc '[:alnum:]-._/' | tr '[:upper:]' '[:lower:]' | tr '/' '-')
            MOVING_TAG="$BRANCH_TAG"
          else
            MOVING_TAG="latest"
          fi
          echo "::notice::Image tags: ${REPO_IMAGE}:${MOVING_TAG}, ${REPO_IMAGE}:${SHA_TAG}"
          echo "moving=${REPO_IMAGE}:${MOVING_TAG}" >> "$GITHUB_OUTPUT"
          echo "sha=${REPO_IMAGE}:${SHA_TAG}" >> "$GITHUB_OUTPUT"

      # The image wraps the jar the steps above built and tested; the Dockerfile compiles nothing.
      - name: Build docker image
        run: docker build -t "${{ steps.set_tag.outputs.moving }}" -t "${{ steps.set_tag.outputs.sha }}" .

      # Pushing needs Docker Hub secrets, which a pull request from a fork does not get: on master,
      # and on pull requests from this repository, only.
      - name: Login to docker hub
        if: success() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Publish image to docker hub
        if: success() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          docker push "${{ steps.set_tag.outputs.moving }}"
          docker push "${{ steps.set_tag.outputs.sha }}"

