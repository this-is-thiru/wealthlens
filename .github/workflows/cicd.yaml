name: Build and Push Docker Image

# 1. ADDED: Trigger on pull requests targeting 'master'
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: [ubuntu-latest]
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      # Fails fast on formatting drift before spending time on the test suite.
      - name: Verify formatting
        run: ./mvnw -q spotless:check

      # -Dmaven.test.failure.ignore=true is set HERE ONLY, so the build reaches `verify`
      # and the consolidated HTML report is generated even when tests fail. The gate below
      # is what fails the pipeline. Local and IDE runs use the default (false) and fail
      # immediately on a test failure, so an exit code means what it says.
      - name: Run Maven tests and generate consolidated report
        run: ./mvnw clean test verify -Dmaven.test.failure.ignore=true

      - name: Check for test failures
        run: |
          # A missing report is not a pass. If the suite did not run, fail rather than
          # succeed on absent evidence.
          MIN_REPORTS=25
          REPORT_COUNT=$(ls backend/target/surefire-reports/TEST-*.xml \
                            test-report/target/surefire-reports/TEST-*.xml 2>/dev/null | wc -l | tr -d ' ')
          echo "Found $REPORT_COUNT surefire report(s)."
          if [ "$REPORT_COUNT" -lt "$MIN_REPORTS" ]; then
            echo "Expected at least $MIN_REPORTS reports. The test suite did not run to completion."
            exit 1
          fi

          FAILED=0
          for f in backend/target/surefire-reports/TEST-*.xml test-report/target/surefire-reports/TEST-*.xml; do
            [ -f "$f" ] || continue
            if grep -E 'failures="[1-9]' "$f" >/dev/null || grep -E 'errors="[1-9]' "$f" >/dev/null; then
              echo "Test failures found in: $f"
              FAILED=1
            fi
          done
          if [ "$FAILED" -eq 1 ]; then
            echo "Failing build due to test failures."
            exit 1
          fi

      - name: Upload consolidated test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consolidated-test-report
          path: test-report/target/consolidated-test-report.html

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage-report
          path: backend/target/site/jacoco/

      # 2. NEW: Step to determine the Docker tag based on the event type
      - name: Set Docker Image Tag
        id: set_tag
        run: |
          # Define the base image name
          REPO_IMAGE="tperamasani/wealthlens"

          if [ "${{ github.event_name }}" == "pull_request" ]; then
            # --- Logic for Pull Requests ---
            # Get the source branch name (head_ref)
            # 1. Sanitize: remove invalid characters (keep alphanumeric, -, ., _)
            # 2. Lowercase: convert everything to lowercase
            # 3. Replace slashes: replace '/' with '-' (e.g., feature/login -> feature-login)
            BRANCH_REF=$(echo "${{ github.head_ref }}" | tr -dc '[:alnum:]-._/' | tr '[:upper:]' '[:lower:]')
            TAG_NAME=${BRANCH_REF//\//-}

            echo "::notice file=build_and_push.sh::Pull Request detected. Tagging image with branch name: $TAG_NAME"
          else
            # --- Logic for Push to Master (Merge) ---
            TAG_NAME="latest"
            echo "::notice file=build_and_push.sh::Push to master detected. Tagging image with: $TAG_NAME"
          fi

          FULL_TAG="${REPO_IMAGE}:${TAG_NAME}"

          # Set the determined tag and full tag as GitHub output variables for subsequent steps
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "full_tag=$FULL_TAG" >> $GITHUB_OUTPUT

      - name: Login to docker hub
        if: success()
        run: docker login -u ${{secrets.DOCKER_USERNAME}} -p ${{secrets.DOCKER_PASSWORD}}

      # 3. UPDATED: Use the dynamically generated full tag
      - name: Build docker image
        if: success()
        run: docker build -t ${{ steps.set_tag.outputs.full_tag }} .

      # 4. UPDATED: Use the dynamically generated full tag
      - name: Publish image to docker hub
        if: success()
        run: docker push ${{ steps.set_tag.outputs.full_tag }}


