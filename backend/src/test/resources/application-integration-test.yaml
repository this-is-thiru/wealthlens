spring:
  mongodb:
    uri: mongodb://localhost:27017/testdb
    database: integration-test
  main:
    allow-bean-definition-overriding: true

app:
  security:
    key-secret: dGVzdC1zZWNyZXQta2V5LWZvci1pbnRlZ3JhdGlvbi10ZXN0cy1vbmx5
  privacy:
    # W-237a: published at GET /privacy/rights (DPDP Rules r.14(1), r.9); named in every response to a rights request
    contact: privacy@example.com
    identifier: "the email address your account is registered with"
    rights:
      - right: "A summary of your personal data and its processing, and of the others it was shared with"
        section: "Digital Personal Data Protection Act, 2023 s.11(1)"
        means: "Write to the contact from the email your account is registered with"
      - right: "Correction, completion or updating of your personal data"
        section: "Digital Personal Data Protection Act, 2023 s.12(1), (2)"
        means: "Write to the contact from the email your account is registered with"
      - right: "Erasure of your personal data"
        section: "Digital Personal Data Protection Act, 2023 s.12(1), (3)"
        means: "Take your copy first, since nothing can be read once you ask: before erasing a tax-planning profile, read its drafts, revisions and computations; before erasing your whole account, also download your portfolio's assets and transactions (POST /portfolio/user/{email}/stocks/download), the only part of it that can be downloaded. Then ask in the app, for one tax-planning profile or for your whole account; your account is erased a year after you ask, and cannot be used meanwhile"
        endpoints: ["POST /tax/user/{email}/profiles/{profileId}/erasure", "POST /privacy/erasure/user/{email}"]
      - right: "Redressal of a grievance about how your personal data is handled"
        section: "Digital Personal Data Protection Act, 2023 s.13"
        means: "Raise it in the app; you are told at once the date by which it will be answered"
        endpoints: ["POST /privacy/grievances/user/{email}"]
      - right: "Nominating another person to exercise these rights on your death or incapacity"
        section: "Digital Personal Data Protection Act, 2023 s.14"
        means: "Write to the contact from the email your account is registered with"
    grievance:
      # W-237b: the days within which a grievance is answered, published in the notice and promised on each receipt
      response-days: 30
      # DPDP Rules, 2025 r.14(3): "a reasonable period not exceeding ninety days" (G.S.R. 846(E), egazette 2025/267650 p.30)
      longest-days-allowed: 90
    breach:
      # W-237c: DPDP Rules, 2025 r.7(2)(b): the detailed report "within seventy-two hours of becoming aware of the breach"
      # (G.S.R. 846(E), egazette 2025/267650 p.26); a longer period the Board allows is recorded per breach
      board-report-hours: 72
    # W-235, W-237d: DPDP Rules, 2025 r.8(3): personal data and logs kept "for a minimum period of one year from the date of
    # such processing", then erased (G.S.R. 846(E), egazette 2025/267650); the erasure request is the last processing
    erasure-hold: P1Y
    # W-237e: DPDP Rules, 2025 r.6(1)(e): logs kept "for a period of one year"; r.8(3): logs of the processing kept "for a
    # minimum period of one year from the date of such processing", then erased (G.S.R. 846(E), egazette 2025/267650 p.26)
    log-retention: P1Y
    # W-249: Act s.8(7)(a) erases once the purpose is no longer served; the purpose lapses three years after the last
    # sign-in. The owner's ruling (D-480), not a figure from the law: Rules r.8(1)'s periods bind only the Third Schedule's
    # classes, which WealthLens is not in; it must exceed erasure-hold, r.8(3)'s year
    purpose-lapse: P3Y
    # W-250: the notice before consent (DPDP Act, 2023 s.5(1), egazette 2023/248045 p.4; DPDP Rules, 2025 r.3, G.S.R. 846(E),
    # egazette 2025/267650 pp.24-25). Every word is part of the notice's version: a change asks new registrations for the new one
    consent:
      # r.3(b)(i): one entry per PersonalDataHolder, keyed by its noticePart()
      personal-data:
        - part: login
          description: "Your sign-in: your email address, your password (kept only as a one-way BCrypt hash), your role, and when you last signed in"
        - part: portfolio
          description: "Your portfolio: your holdings, your trades (including those waiting on a corporate action) and their outcomes, your profit and loss, the broker and fund charges on each trade, your charge accounts, and which corporate actions were last applied to your holdings"
        - part: insurance
          description: "Your insurance policies, if you recorded any"
        - part: tax-planning
          description: "Your tax planning: each taxpayer profile (name, PAN, date of birth, and disability or date of death where given), salary details, tax computations and drafts, a record of each time a profile was read, and your requests to erase a profile"
        - part: privacy-records
          description: "Your privacy requests: grievances and their answers, notices to you of a personal data breach, a log of the requests made with your account, and the record of this notice and your consent"
      # r.3(b)(ii)
      purpose: "To track your investments (holdings, trades, profit and loss, and the charges on them), keep your insurance records and plan your income tax, for you, while you keep your account"
      # Act s.6(4), r.3(c)(i): the account erasure request is the withdrawal (W-250 C3a, D-481)
      withdrawal: "Withdraw your consent at any time by asking for your whole account to be erased (POST /privacy/erasure/user/{email}): one request, as registering was. All processing stops at once, and your data is erased as the right to erasure above describes"
      # Act s.5(1)(iii), s.13(3), r.3(c)(iii), r.20: no address for the Board is in the Act or the Rules; the owner adds its link when given (W-250 C5a)
      board-complaint: "If a grievance raised here is not resolved, you may complain to the Data Protection Board of India, which works as a digital office (DPDP Rules r.20). The Act asks you to raise it here first (s.13(3))"
  personal-data:
    data-key: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
    digest-key: HyAhIiMkJSYnKCkqKywtLi8wMTIzNDU2Nzg5Ojs8PT4=
  tax:
    jobs:
      enabled: false
      gazette-watch-cron: "0 0 5 * * *"
    gazette-watch:
      # W-236: off until the owner seeds the cursor and turns it on (runbook §1.w)
      enabled: false
      base-url: https://egazette.gov.in/WriteReadData
      user-agent: WealthLens-GazetteWatch/1.0
      timeout: 10s
      pause: 1s
      max-numbers-per-run: 400
      misses-to-stop: 20
      max-document-size: 40MB
      # A copy naming the Board, or the Act with the Department, is a lead (sources/2026-11-07-gazette-watch-window.md)
      lead-when-any: ["central board of direct taxes"]
      lead-when-all: ["income-tax act", "department of revenue"]
    retention:
      archive-after: P18M
      purge-archived-after: P12M
      # W-239: DR 14 O5 — a landlord or lender is kept to the end of the tax year it last supports, plus this
      third-party-after: P2Y
  mongodb:
    transactions-enabled: true

logging:
  level:
    org.springframework.data.mongodb.core.MongoTemplate: DEBUG
