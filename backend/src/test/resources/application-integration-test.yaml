spring:
  mongodb:
    uri: mongodb://localhost:27017/testdb
    database: integration-test
  main:
    allow-bean-definition-overriding: true

app:
  security:
    key-secret: dGVzdC1zZWNyZXQta2V5LWZvci1pbnRlZ3JhdGlvbi10ZXN0cy1vbmx5
  tax:
    data-key: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
    digest-key: HyAhIiMkJSYnKCkqKywtLi8wMTIzNDU2Nzg5Ojs8PT4=
    privacy-contact: privacy@example.com
    jobs:
      enabled: false
      gazette-watch-cron: "0 0 5 * * *"
    gazette-watch:
      # W-236: off until the owner seeds the cursor and turns it on (runbook §1.w)
      enabled: false
      base-url: https://egazette.gov.in/WriteReadData
      user-agent: WealthLens-GazetteWatch/1.0
      timeout: 10s
      pause: 1s
      max-numbers-per-run: 400
      misses-to-stop: 20
      max-document-size: 40MB
      # A copy naming the Board, or the Act with the Department, is a lead (sources/2026-11-07-gazette-watch-window.md)
      lead-when-any: ["central board of direct taxes"]
      lead-when-all: ["income-tax act", "department of revenue"]
    retention:
      archive-after: P18M
      purge-archived-after: P12M
      # Data Protection Rules, 2025 r.8(3): a year from the erasure request, the last processing (W-235)
      erasure-hold: P1Y
  mongodb:
    transactions-enabled: true

logging:
  level:
    org.springframework.data.mongodb.core.MongoTemplate: DEBUG
