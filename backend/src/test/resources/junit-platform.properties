# Parallel execution.
#
# Methods run in the same thread (many tests share @InjectMocks state within a class);
# separate test CLASSES run concurrently, which is where the wall-clock win is.
#
# AbstractIntegrationTest is annotated @Isolated: every integration test class runs alone,
# with nothing else in parallel. That is required, not merely cautious — RestAssured's
# baseURI/port are static globals, and all integration classes share one MongoDB container.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=concurrent
junit.jupiter.execution.parallel.config.strategy=dynamic
junit.jupiter.execution.parallel.config.dynamic.factor=1
