server:
  port: 8080

spring:
  application:
    name: wealthlens

  mongodb:
    uri: mongodb+srv://${MONGO_USER}:${MONGO_PASSWORD}@cluster0.x6trgen.mongodb.net/?retryWrites=true&w=majority
    database: Cluster0

app:
  security:
    key-secret: ${JWT_SECURITY_KEY}
  privacy:
    # W-237a: published at GET /privacy/rights (DPDP Rules r.14(1), r.9); named in every response to a rights request
    contact: ${PRIVACY_CONTACT}
    identifier: "the email address your account is registered with"
    rights:
      - right: "A summary of your personal data and its processing, and of the others it was shared with"
        section: "Digital Personal Data Protection Act, 2023 s.11(1)"
        means: "Write to the contact from the email your account is registered with"
      - right: "Correction, completion or updating of your personal data"
        section: "Digital Personal Data Protection Act, 2023 s.12(1), (2)"
        means: "Write to the contact from the email your account is registered with"
      - right: "Erasure of your personal data"
        section: "Digital Personal Data Protection Act, 2023 s.12(1), (3)"
        means: "Ask in the app, for one tax-planning profile or for your whole account; your account is erased a year after you ask, and cannot be used meanwhile"
        endpoints: ["POST /tax/user/{email}/profiles/{profileId}/erasure", "POST /privacy/erasure/user/{email}"]
      - right: "Redressal of a grievance about how your personal data is handled"
        section: "Digital Personal Data Protection Act, 2023 s.13"
        means: "Raise it in the app; you are told at once the date by which it will be answered"
        endpoints: ["POST /privacy/grievances/user/{email}"]
      - right: "Nominating another person to exercise these rights on your death or incapacity"
        section: "Digital Personal Data Protection Act, 2023 s.14"
        means: "Write to the contact from the email your account is registered with"
    grievance:
      # W-237b: the days within which a grievance is answered, published in the notice and promised on each receipt
      response-days: 30
      # DPDP Rules, 2025 r.14(3): "a reasonable period not exceeding ninety days" (G.S.R. 846(E), egazette 2025/267650 p.30)
      longest-days-allowed: 90
    breach:
      # W-237c: DPDP Rules, 2025 r.7(2)(b): the detailed report "within seventy-two hours of becoming aware of the breach"
      # (G.S.R. 846(E), egazette 2025/267650 p.26); a longer period the Board allows is recorded per breach
      board-report-hours: 72
    # W-235, W-237d: DPDP Rules, 2025 r.8(3): personal data and logs kept "for a minimum period of one year from the date of
    # such processing", then erased (G.S.R. 846(E), egazette 2025/267650); the erasure request is the last processing
    erasure-hold: P1Y
  tax:
    data-key: ${TAX_DATA_KEY}
    digest-key: ${TAX_DIGEST_KEY}
    jobs:
      enabled: true
      auto-archive-cron: "0 0 3 * * SUN"
      retention-purge-cron: "0 0 4 1 * *"
      # W-237d: daily, so an account is erased within a day of its hold ending
      account-erasure-cron: "0 30 4 * * *"
      gazette-watch-cron: "0 0 5 * * *"
    gazette-watch:
      # W-236: off until the owner seeds the cursor and turns it on (runbook §1.w)
      enabled: false
      base-url: https://egazette.gov.in/WriteReadData
      user-agent: WealthLens-GazetteWatch/1.0
      timeout: 10s
      pause: 1s
      max-numbers-per-run: 400
      misses-to-stop: 20
      max-document-size: 40MB
      # A copy naming the Board, or the Act with the Department, is a lead (sources/2026-11-07-gazette-watch-window.md)
      lead-when-any: ["central board of direct taxes"]
      lead-when-all: ["income-tax act", "department of revenue"]
    retention:
      archive-after: P18M
      purge-archived-after: P12M
  portfolio:
    idempotency:
      # How long a trade with NO client-supplied idempotencyKey stays de-duplicable, in seconds.
      # A client retrying a timed-out request comes back within seconds; a person entering the same
      # trade twice deliberately takes longer. 60s covers a 30s HTTP timeout plus a retry.
      #
      # Two genuinely identical trades submitted inside this window are collapsed into one. That is
      # the accepted trade-off, and the escape hatch is for the caller to send an idempotencyKey --
      # a supplied key is exact, has no window, and lets both through.
      #
      # Set to 0 to disable the derived-fingerprint fallback entirely. Client-supplied keys keep
      # working either way.
      window-seconds: 60
  charges:
    # MASTER SWITCH. Set false to stop the charges engine computing or recording anything:
    # /charges/simulate and the AMC cycle answer 503, and shadow recording
    # records nothing whatever shadow-recording below says. Reading charges already recorded still
    # works, which is what you need in order to decide whether to turn it back on.
    engine-enabled: true
    # The engine prices and records every V2 trade beside the live flow. On: the reconciliation
    # report has data and GET /user-charges/user/{email} shows what each trade cost. Turning it
    # off again is the whole rollback. Has no effect when engine-enabled is false.
    shadow-recording: true
    # The computed total becomes the cost basis on a V2 buy (AC-10). On: new trades are costed by
    # the engine rather than by whatever the client sent in AssetRequest.brokerCharges.
    #
    # ORDER MATTERS. Both flags above need rate cards to exist, and seeding is a deliberate act
    # (ADR-27) -- a fresh database has none. Run POST /charges/seed BEFORE the first trade, or
    # every trade resolves NO_SCHEDULE and is charged nothing. ChargeReadinessAuditor warns at
    # startup when that is the case; docs/charges-engine/production-runbook.md is the procedure.
    authoritative: true
