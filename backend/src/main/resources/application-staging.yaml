server:
  port: 8080

spring:
  application:
    name: wealthlens

  mongodb:
    uri: mongodb+srv://${MONGO_USER}:${MONGO_PASSWORD}@it-staging.6fu8nvy.mongodb.net/?retryWrites=true&w=majority
    database: it-staging

app:
  security:
    key-secret: ${JWT_SECURITY_KEY}
  charges:
    # MASTER SWITCH. Set false to stop the charges engine computing or recording anything:
    # /charges/simulate and the AMC cycle answer 503, and shadow recording
    # records nothing whatever shadow-recording below says. Reading charges already recorded still
    # works, which is what you need in order to decide whether to turn it back on.
    engine-enabled: true
    # The engine prices and records every V2 trade beside the live flow. On: the reconciliation
    # report has data and GET /user-charges/user/{email} shows what each trade cost. Turning it
    # off again is the whole rollback. Has no effect when engine-enabled is false.
    shadow-recording: true
    # The computed total becomes the cost basis on a V2 buy (AC-10). On: new trades are costed by
    # the engine rather than by whatever the client sent in AssetRequest.brokerCharges.
    #
    # ORDER MATTERS. Both flags above need rate cards to exist, and seeding is a deliberate act
    # (ADR-27) -- a fresh database has none. Run POST /charges/seed BEFORE the first trade, or
    # every trade resolves NO_SCHEDULE and is charged nothing. ChargeReadinessAuditor warns at
    # startup when that is the case; docs/charges-engine/production-runbook.md is the procedure.
    authoritative: true
