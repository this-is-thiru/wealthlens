server:
  port: 8080

spring:
  application:
    name: wealthlens

  mongodb:
    uri: mongodb+srv://${MONGO_USER}:${MONGO_PASSWORD}@it-staging.6fu8nvy.mongodb.net/?retryWrites=true&w=majority
    database: it-staging

app:
  security:
    key-secret: ${JWT_SECURITY_KEY}
  mongodb:
    transactions-enabled: true
  charges:
    # Phase A: the engine is live and the simulate API is usable.
    engine-enabled: true
    # Phase B: the engine prices and records every trade beside the live flow, and the result is
    # ignored. Off by default -- turning it on is what makes the reconciliation report have data,
    # and turning it off is the whole rollback.
    shadow-recording: false
    # Phase C: the computed total drives cost basis. Nothing reads this yet.
    authoritative: false
